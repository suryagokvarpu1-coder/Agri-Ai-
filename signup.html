<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="site_title">Sign Up · Agri-AI</title>
<meta name="description" content="Create your Agri-AI account for AI-powered precision farming.">
<script src="translations.js"></script><script src="global-settings.js"></script>
<script src="api-config.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>
<link rel="stylesheet" href="3d-theme.css">
<script src="3d-animations.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;background:#f8fafc;color:#0f172a;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:2rem 1rem;-webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:440px;
  background:rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(16px);
  border:1px solid rgba(255, 255, 255, 0.1);
  border-radius:24px;
  padding:2.5rem 2rem;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  transition: transform 0.3s ease;
}
.card:hover { transform: translateY(-5px); }
.premium-3d .title { color: #fff; }
.input{
  width:100%;padding:0.75rem 1rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius:12px;
  font-size:0.875rem;outline:none;transition:all 0.2s;
  color: #fff;
}
.input:focus{
  border-color:#16a34a;
  background: rgba(22, 163, 74, 0.05);
  box-shadow:0 0 0 3px rgba(22, 163, 74, 0.2);
}
.btn{
  width:100%;padding:0.75rem;background:#16a34a;color:white;
  border:none;border-radius:6px;font-weight:600;font-size:0.875rem;
  cursor:pointer;transition:background 0.2s;margin-top:0.5rem;
}
.btn:hover{background:#15803d}
.btn:disabled{opacity:0.7;cursor:not-allowed}
.msg{padding:0.75rem;border-radius:6px;font-size:0.8125rem;margin-bottom:1.125rem;display:none}
.msg.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.msg.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.footer{text-align:center;margin-top:1.5rem;font-size:0.875rem;color:#64748b}
.footer a{color:#16a34a;text-decoration:none;font-weight:600}
.footer a:hover{text-decoration:underline}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Social Buttons Styling */
.social-divider {
  display: flex;
  align-items: center;
  margin: 1.5rem 0;
  color: #64748b;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.social-divider::before, .social-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.1);
}
.social-divider span {
  padding: 0 0.75rem;
}
.social-btns {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.75rem;
  border-radius: 12px;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05);
  color: white;
}
.social-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-1px);
}
.social-btn svg {
  width: 18px;
  height: 18px;
}
.btn-google:hover { border-color: #4285f4; background: rgba(66, 133, 244, 0.1); }
.btn-github:hover { border-color: #333; background: rgba(51, 51, 51, 0.2); }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap" style="flex-direction: column; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; display: flex;">
    <div class="logo" style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); display: flex; align-items: center; justify-content: center;">
      <svg width="28" height="28" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M5 5l14 14M5 19L19 5" opacity="0.3"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" />
      </svg>
    </div>
    <span style="font-weight: 900; letter-spacing: -0.05em; font-size: 1.5rem; color: #fff;">Agri-AI</span>
  </div>
  <h1 class="title" data-i18n="auth_signup_title">Create Account</h1>
  <p class="subtitle" data-i18n="auth_signup_subtitle">Start your 14-day free trial today</p>
  
  <div id="msg-err" class="msg err"></div>
  <div id="msg-ok" class="msg ok"></div>
  
  <form id="signup-form">
    <div class="grid">
      <div class="field">
        <label class="label" for="fn" data-i18n="auth_full_name">Full Name</label>
        <input id="fn" class="input" type="text" placeholder="John Doe" required>
      </div>
      <div class="field">
        <label class="label" for="un" data-i18n="auth_username">Username</label>
        <input id="un" class="input" type="text" placeholder="johndoe" required>
      </div>
    </div>
    <div class="field">
      <label class="label" for="em" data-i18n="auth_email">Email Address</label>
      <input id="em" class="input" type="email" placeholder="john@example.com" required>
    </div>
    <div class="grid">
      <div class="field">
        <label class="label" for="pw" data-i18n="auth_password">Password</label>
        <input id="pw" class="input" type="password" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label class="label" for="cp" data-i18n="auth_confirm_password">Confirm</label>
        <input id="cp" class="input" type="password" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn" id="btn">Create Account</button>
  </form>

  <div class="social-divider">
    <span data-i18n="auth_or_continue">Or continue with</span>
  </div>

  <div class="social-btns">
    <button type="button" class="social-btn btn-google" id="custom_google_btn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign In with Google
    </button>
  </div>
  
  <div class="footer">
    <span data-i18n="auth_have_account">Already have an account?</span> 
    <a href="login.html" data-i18n="auth_signin_here">Sign in</a>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.AuthSystem.isLoggedIn()) {
    window.location.href = 'overview.html';
    return;
  }
  
  document.getElementById('signup-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fn = document.getElementById('fn').value.trim();
    const un = document.getElementById('un').value.trim();
    const em = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    const cp = document.getElementById('cp').value;
    
    hide();
    if (pw !== cp) {
      show('err', 'Passwords do not match');
      return;
    }
    if (pw.length < 6) {
      show('err', 'Password must be at least 6 characters');
      return;
    }
    
    setLoad(true);
    try {
      const r = await window.AuthSystem.register(un, pw, fn, em);
      setLoad(false);
      if (r.success) {
        show('ok', '✓ Account created successfully! Logging in...');
        setTimeout(() => { window.location.href = 'overview.html'; }, 1000);
      } else {
        show('err', r.error || 'Registration failed');
      }
    } catch (err) {
      setLoad(false);
      show('err', err.message || 'Registration error');
    }
  });
  
  document.getElementById('custom_google_btn').addEventListener('click', async (e) => {
    e.preventDefault();
    hide();
    setLoad(true);
    try {
      const r = await window.AuthSystem.loginWithGoogle();
      if (r.success) {
        show('ok', '✓ Signed in with Google successfully!');
        setTimeout(() => { window.location.href = 'overview.html'; }, 800);
      }
    } catch (err) {
      setLoad(false);
      show('err', err.message || 'Google Sign-In failed');
    }
  });
  
  function show(t, m) {
    const el = document.getElementById('msg-' + t);
    el.textContent = m;
    el.style.display = 'block';
  }
  
  function hide() {
    ['err', 'ok'].forEach(t => {
      document.getElementById('msg-' + t).style.display = 'none';
    });
  }
  
  function setLoad(on) {
    const b = document.getElementById('btn');
    b.disabled = on;
    b.textContent = on ? 'Creating account...' : 'Create Account';
    document.getElementById('custom_google_btn').disabled = on;
  }
});
</script>
<style>
  .g-account:hover { background: #f1f5f9 !important; }
  @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</body>
</html>
